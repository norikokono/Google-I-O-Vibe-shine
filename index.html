<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Stealth Glow Edition</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            cursor: crosshair;
        }

        #gradient-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
            transition: background 0.8s ease;
            /* Inverted Gradient: Black center, faint glow outside */
            background: radial-gradient(circle at center, transparent 20%, rgba(0, 242, 254, 0.05) 100%);
        }

        #scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px;
            opacity: 0.2;
        }

        canvas { 
            display: block; 
            position: relative; 
            z-index: 2; 
            background: transparent;
            filter: contrast(1.1) brightness(1.1); 
        }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            20% { transform: translate(-2px, 0px); }
            40% { transform: translate(1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }
        .shaking { animation: shake 0.1s infinite; }

        #ui {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3); font-size: 10px; letter-spacing: 5px;
            pointer-events: none; text-transform: uppercase; z-index: 10;
            text-align: center;
        }

        #footer-stamp {
            position: absolute; bottom: 20px; right: 20px;
            color: rgba(255, 255, 255, 0.15); font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase; z-index: 10;
            text-align: right;
        }

        #creator-name { color: #00f2fe; font-weight: bold; }
    </style>
</head>
<body>
    <div id="gradient-overlay"></div>
    <div id="scanlines"></div>
    <div id="ui">
        STATUS: <span id="msg">SYSTEM STANDBY</span><br>
        <small style="opacity:0.4; letter-spacing:1px;">(CLICK TO ENABLE AUDIO)</small>
    </div>
    <canvas id="c"></canvas>

    <div id="footer-stamp">
        COLLABORATION: <span id="creator-name">GEMINI AI & NORIKO</span><br>
        DATE: <span id="current-date"></span>
    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('gradient-overlay');
const msg = document.getElementById('msg');

// --- AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, volume) {
    if (audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

const playTick = () => playSound(350 + (10 - count) * 40, 'sine', 0.1, 0.08);
const playExplosion = () => {
    playSound(60, 'square', 1.2, 0.15);
    playSound(40, 'sawtooth', 1.0, 0.2);
};

// --- PARTICLES ---
let w, h, dpr, particles = [];
let count = 10;
let isExposed = false;

const sampleCanvas = document.createElement('canvas');
const sCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

class Particle {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.tx = this.x; this.ty = this.y;
        this.vx = 0; this.vy = 0;
        this.size = Math.random() * 1.5 + 1;
        this.color = '#fff';
    }
    update() {
        if (isExposed) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.96; this.vy *= 0.96; 
        } else {
            this.vx = (this.tx - this.x) * 0.12;
            this.vy = (this.ty - this.y) * 0.12;
            this.x += this.vx;
            this.y += this.vy;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    sampleCanvas.width = w; sampleCanvas.height = h;
    if(!isExposed) morph(count);
}

function morph(content) {
    sCtx.clearRect(0, 0, w, h);
    sCtx.fillStyle = "white";
    sCtx.textAlign = "center";
    sCtx.textBaseline = "middle";
    sCtx.font = `bold ${Math.min(w, h) * 0.75}px sans-serif`;
    sCtx.fillText(content, w/2, h/2);

    // --- INVERTED GRADIENT TONE ---
    const hue = 180 + (parseInt(count) * 20); 
    // Transparent center to keep the background of the numbers PURE BLACK
    overlay.style.background = `radial-gradient(circle at center, transparent 30%, hsla(${hue}, 100%, 50%, 0.1) 100%)`;

    const imgData = sCtx.getImageData(0, 0, w, h).data;
    const points = [];
    for (let y = 0; y < h; y += 4) {
        for (let x = 0; x < w; x += 4) {
            if (imgData[(y * w + x) * 4 + 3] > 128) points.push({x, y});
        }
    }

    if (particles.length < points.length) {
        for (let i = particles.length; i < points.length; i++) particles.push(new Particle());
    }

    particles.forEach((p, i) => {
        const pt = points[i % points.length];
        p.tx = pt.x; p.ty = pt.y;
        p.color = (count === "WIN") ? "#00f2fe" : `hsl(${hue}, 80%, 65%)`;
    });
    
    if (content !== "WIN") {
        canvas.classList.add('shaking');
        setTimeout(() => canvas.classList.remove('shaking'), 120);
        playTick();
    }
}

function expose() {
    isExposed = true;
    msg.innerText = "CRITICAL // EXPOSURE ACTIVE";
    overlay.style.background = `radial-gradient(circle at center, transparent 10%, hsla(300, 100%, 50%, 0.2) 100%)`;
    playExplosion();
    
    particles.forEach(p => {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 25 + 10;
        p.vx = Math.cos(angle) * velocity;
        p.vy = Math.sin(angle) * velocity;
        p.color = `hsl(${Math.random() * 60 + 280}, 100%, 75%)`; 
    });

    setTimeout(() => {
        isExposed = false;
        count = "WIN";
        morph("WIN");
        msg.innerText = "SEQUENCE TERMINATED";
    }, 1500);
}

function loop() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(loop);
}

window.addEventListener('mousedown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); });
window.addEventListener('resize', resize);
document.getElementById('current-date').textContent = new Date().toLocaleDateString();
resize();

const timer = setInterval(() => {
    if (!isExposed && count !== "WIN") {
        count--;
        if (count > 0) { morph(count); } 
        else { clearInterval(timer); expose(); }
    }
}, 1000);

loop();
</script>
</body>
</html>
