<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Smooth Gradient Fix</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
        }

        /* The Orange Layer - Solid and static to prevent vibration */
        #background-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 0% 0%, #3a1a00 0%, transparent 25%),
                radial-gradient(circle at 100% 0%, #2a1200 0%, transparent 20%),
                radial-gradient(circle at 100% 100%, #4a2200 0%, transparent 30%),
                radial-gradient(circle at 0% 100%, #2f1500 0%, transparent 22%),
                #000;
        }

        #texture-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.1;
        }

        .grid { background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 30px 30px; }

        canvas { 
            display: block; 
            position: relative; 
            z-index: 2; 
            /* Remove filters that cause flickering */
        }

        #ui {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4); font-size: 10px; letter-spacing: 5px;
            z-index: 10; text-align: center;
        }
    </style>
</head>
<body>
    <div id="background-layer"></div>
    <div id="texture-overlay" class="grid"></div>
    <div id="ui">STATUS: <span id="msg">INITIALIZING...</span></div>
    <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h, dpr, particles = [];
let count = 10;
let isExposed = false;

// ... [Keep your Particle class and Morph function exactly as they were] ...

function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
}

function loop() {
    // FIX: Clear the canvas with clearRect instead of fillRect(rgba)
    // This stops the "vibration" because it's no longer stacking black layers
    ctx.clearRect(0, 0, w, h); 
    
    // To keep the "trail" effect without breaking gradients, 
    // we use a global alpha for particles instead of a black overlay
    particles.forEach(p => { 
        p.update(); 
        p.draw(); 
    });
    requestAnimationFrame(loop);
}

// ... [Keep your timer and event listeners] ...

resize();
loop();
</script>
</body>
</html>
