<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Mood Shift Edition</title>
    <style>
        /* Smooth background color transition */
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            cursor: crosshair;
            transition: background-color 0.8s ease; 
        }
        canvas { display: block; filter: contrast(1.2) brightness(1.2); }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
        .shaking { animation: shake 0.2s infinite; }

        #ui {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4); font-size: 10px; letter-spacing: 5px;
            pointer-events: none; text-transform: uppercase; z-index: 10;
            text-align: center;
        }

        #footer-stamp {
            position: absolute; bottom: 20px; right: 20px;
            color: rgba(255, 255, 255, 0.2); font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase; z-index: 10;
            text-align: right; line-height: 1.6;
        }

        #creator-name { color: #00f2fe; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        Status: <span id="msg">System Standby</span><br>
        <small style="letter-spacing: 1px; opacity: 0.5;">(Click screen to enable audio sync)</small>
    </div>
    
    <canvas id="c"></canvas>

    <div id="footer-stamp">
        COLLABORATION: <span id="creator-name">GEMINI AI & YOUR NAME</span><br>
        DATE: <span id="current-date"></span>
    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');

// --- AUDIO ENGINE ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, volume) {
    if (audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

const playTick = () => playSound(440 + (10 - count) * 50, 'sine', 0.15, 0.1);
const playExplosion = () => {
    playSound(100, 'square', 1.5, 0.2);
    playSound(50, 'sawtooth', 1.2, 0.3);
};

// --- BACKGROUND MOOD COLORS ---
// Deep atmospheric colors that contrast with the neon particles
const bgColors = [
    "#000000", // 10
    "#0a0510", // 9
    "#050a10", // 8
    "#05100a", // 7
    "#100a05", // 6
    "#100505", // 5
    "#0e0e0e", // 4
    "#1a0a1a", // 3
    "#0a1a1a", // 2
    "#1a1a0a", // 1
    "#220033"  // WIN
];

// --- PARTICLE ENGINE ---
let w, h, dpr, particles = [];
let count = 10;
let isExposed = false;

const sampleCanvas = document.createElement('canvas');
const sCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

class Particle {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.tx = this.x; this.ty = this.y;
        this.vx = 0; this.vy = 0;
        this.size = Math.random() * 1.5 + 1;
        this.color = '#fff';
    }
    update() {
        if (isExposed) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.97; this.vy *= 0.97; 
        } else {
            this.vx = (this.tx - this.x) * 0.09;
            this.vy = (this.ty - this.y) * 0.09;
            this.x += this.vx;
            this.y += this.vy;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    sampleCanvas.width = w;
    sampleCanvas.height = h;
    if(!isExposed) morph(count);
}

function triggerShake(duration = 200) {
    canvas.classList.add('shaking');
    setTimeout(() => canvas.classList.remove('shaking'), duration);
}

function morph(content) {
    sCtx.clearRect(0, 0, w, h);
    sCtx.fillStyle = "white";
    sCtx.textAlign = "center";
    sCtx.textBaseline = "middle";
    sCtx.font = `bold ${Math.min(w, h) * 0.75}px sans-serif`;
    sCtx.fillText(content, w/2, h/2);

    // Update Background Color based on current count
    const colorIndex = content === "WIN" ? 10 : 10 - parseInt(content);
    document.body.style.backgroundColor = bgColors[colorIndex];

    const imgData = sCtx.getImageData(0, 0, w, h).data;
    const points = [];
    for (let y = 0; y < h; y += 4) {
        for (let x = 0; x < w; x += 4) {
            if (imgData[(y * w + x) * 4 + 3] > 128) points.push({x, y});
        }
    }

    if (particles.length < points.length) {
        for (let i = particles.length; i < points.length; i++) particles.push(new Particle());
    }

    particles.forEach((p, i) => {
        const pt = points[i % points.length];
        p.tx = pt.x; p.ty = pt.y;
        p.color = (count === "WIN") ? "#00f2fe" : `hsl(${180 + (parseInt(count) * 15)}, 80%, 60%)`;
    });
    
    if (content !== "WIN") {
        triggerShake(150);
        playTick();
    }
}

function expose() {
    isExposed = true;
    msg.innerText = "System Critical // Exposure Active";
    triggerShake(1200);
    playExplosion();
    
    // Final dramatic background shift for exposure
    document.body.style.backgroundColor = "#110011";

    particles.forEach(p => {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 25 + 15;
        p.vx = Math.cos(angle) * velocity;
        p.vy = Math.sin(angle) * velocity;
        const hue = Math.random() * 80 + 260; 
        p.color = `hsl(${hue}, 100%, 70%)`; 
    });

    setTimeout(() => {
        isExposed = false;
        count = "WIN";
        morph("WIN");
        msg.innerText = "Sequence Complete // Exposure Finalized";
    }, 1600);
}

function loop() {
    // Note: Trail alpha adjusted to 0.15 to make background shifts more visible
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
    ctx.clearRect(0, 0, w, h); // Clear the canvas slightly to let body color show through
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
    ctx.fillRect(0, 0, w, h);
    
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(loop);
}

window.addEventListener('mousedown', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
});

window.addEventListener('resize', resize);
document.getElementById('current-date').textContent = new Date().toLocaleDateString();
resize();

const timer = setInterval(() => {
    if (!isExposed && count !== "WIN") {
        count--;
        if (count > 0) {
            morph(count);
            msg.innerText = `Syncing Frequency: ${count}`;
        } else {
            clearInterval(timer);
            expose();
        }
    }
}, 1000);

loop();
</script>
</body>
</html>
