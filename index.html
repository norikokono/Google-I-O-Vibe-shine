<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Smooth Gradient Fix</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000000;
            background-image: 
                radial-gradient(circle at top-left, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at top-right, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at bottom-left, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at bottom-right, rgba(255,255,255,0.05) 0%, transparent 50%);
            background-size: 100% 100%;
            background-attachment: fixed;
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
        }

        #texture-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.1;
        }

        .grid { background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 30px 30px; }

        canvas { 
            display: block; 
            position: relative; 
            z-index: 2; 
        }

        #ui {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4); font-size: 10px; letter-spacing: 5px;
            z-index: 10; text-align: center;
        }
    </style>
</head>
<body>
    <div id="texture-overlay" class="grid"></div>
    <div id="ui">STATUS: <span id="msg">INITIALIZING...</span></div>
    <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h, dpr, particles = [];
let count = 10;
let isExposed = false;

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.life = 1;
        this.decay = Math.random() * 0.01 + 0.005;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.vx *= 0.98;
        this.vy *= 0.98;
    }

    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.5})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function Morph(from, to, duration = 500) {
    let start = Date.now();
    let startParticles = particles.length;

    let morphInterval = setInterval(() => {
        let elapsed = Date.now() - start;
        let progress = Math.min(elapsed / duration, 1);

        // Create transition particles
        if (progress < 1) {
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle(
                    from.x + (to.x - from.x) * progress,
                    from.y + (to.y - from.y) * progress
                ));
            }
        }

        if (progress >= 1) {
            clearInterval(morphInterval);
        }
    }, 16);
}

function drawNumber(num, x, y, size = 100) {
    ctx.font = `bold ${size}px 'Inter', sans-serif`;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(num, x, y);
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; 
    h = window.innerHeight;
    canvas.width = w * dpr; 
    canvas.height = h * dpr;
    canvas.style.width = w + 'px'; 
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
}

let countdown = 10;
let lastUpdate = Date.now();

function loop() {
    ctx.clearRect(0, 0, w, h); 
    
    // Update particles
    particles.forEach((p, i) => { 
        p.update(); 
        p.draw();
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    });

    // Draw countdown number
    drawNumber(countdown, w / 2, h / 2, 120);

    // Update countdown every 1 second
    if (Date.now() - lastUpdate >= 1000) {
        countdown--;
        lastUpdate = Date.now();

        if (countdown < 0) {
            isExposed = true;
            document.getElementById('msg').textContent = 'EXPOSURE COMPLETE';
            countdown = 0;
        } else {
            document.getElementById('msg').textContent = `COUNTING DOWN: ${countdown}`;
        }

        // Create particle burst on number change
        for (let i = 0; i < 5; i++) {
            particles.push(new Particle(w / 2, h / 2));
        }
    }

    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);

resize();
loop();

// Allow reset with click
canvas.addEventListener('click', () => {
    countdown = 10;
    isExposed = false;
    particles = [];
    document.getElementById('msg').textContent = 'INITIALIZING...';
    lastUpdate = Date.now();
});
</script>
</body>
</html>
