<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Final Entry</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; filter: contrast(1.2) brightness(1.1); }
        #ui {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5); font-size: 12px; letter-spacing: 4px;
            pointer-events: none; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="ui">Status: <span id="msg">Initializing Particle Mesh...</span></div>
    <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');

let w, h, dpr, particles = [];
let count = 10;
let isExposed = false;

// Optimization: Use a smaller offscreen canvas for text sampling
const sampleCanvas = document.createElement('canvas');
const sCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

class Particle {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.tx = this.x; this.ty = this.y;
        this.vx = 0; this.vy = 0;
        this.size = 1.5;
        this.color = '#fff';
    }
    update() {
        if (isExposed) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.98; this.vy *= 0.98; // Add drag
        } else {
            const dx = this.tx - this.x;
            const dy = this.ty - this.y;
            this.vx = dx * 0.08;
            this.vy = dy * 0.08;
            this.x += this.vx;
            this.y += this.vy;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    w = canvas.width = window.innerWidth * dpr;
    h = canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr, dpr);
    sampleCanvas.width = window.innerWidth;
    sampleCanvas.height = window.innerHeight;
    if(!isExposed) morph(count);
}

function morph(content) {
    sCtx.clearRect(0, 0, sampleCanvas.width, sampleCanvas.height);
    sCtx.fillStyle = "white";
    sCtx.textAlign = "center";
    sCtx.textBaseline = "middle";
    sCtx.font = `bold ${Math.min(sampleCanvas.width, sampleCanvas.height) * 0.7}px sans-serif`;
    sCtx.fillText(content, sampleCanvas.width/2, sampleCanvas.height/2);

    const imgData = sCtx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height).data;
    const points = [];
    const gap = 4; // Quality/Performance balance

    for (let y = 0; y < sampleCanvas.height; y += gap) {
        for (let x = 0; x < sampleCanvas.width; x += gap) {
            if (imgData[(y * sampleCanvas.width + x) * 4 + 3] > 128) {
                points.push({x, y});
            }
        }
    }

    if (particles.length < points.length) {
        for (let i = particles.length; i < points.length; i++) particles.push(new Particle());
    }

    particles.forEach((p, i) => {
        const pt = points[i % points.length];
        p.tx = pt.x; p.ty = pt.y;
        p.color = `hsl(${180 + (count * 15)}, 80%, 60%)`;
    });
}

function expose() {
    isExposed = true;
    msg.innerText = "Sequence Complete // Exposure Active";
    particles.forEach(p => {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 15 + 5;
        p.vx = Math.cos(angle) * velocity;
        p.vy = Math.sin(angle) * velocity;
        p.color = "#fff";
    });

    // Final reveal after explosion
    setTimeout(() => {
        isExposed = false;
        count = "WIN";
        morph("WIN");
        msg.innerText = "Exposure Successful";
    }, 1200);
}

function init() {
    resize();
    const timer = setInterval(() => {
        count--;
        if (count > 0) {
            morph(count);
            msg.innerText = `Synchronizing: ${count}`;
        } else {
            clearInterval(timer);
            expose();
        }
    }, 1000);
    loop();
}

function loop() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Trail effect
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
init();
</script>
</body>
</html>
