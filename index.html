<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Final Entry</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; filter: contrast(1.1) brightness(1.1); }
        
        #ui {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5); font-size: 12px; letter-spacing: 4px;
            pointer-events: none; text-transform: uppercase; z-index: 10;
        }

        #footer-stamp {
            position: absolute; bottom: 20px; right: 20px;
            color: rgba(255, 255, 255, 0.3); font-size: 10px;
            letter-spacing: 2px; text-transform: uppercase; z-index: 10;
        }

        #creator-name { color: #00f2fe; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">Status: <span id="msg">Initializing Particle Mesh...</span></div>
    
    <canvas id="c"></canvas>

    <div id="footer-stamp">
        CREATED BY: <span id="creator-name">YOUR NAME</span> | 
        DATE: <span id="current-date"></span>
    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');

let w, h, dpr, particles = [];
let count = 10;
let isExposed = false;

// Sampling canvas for coordinate mapping
const sampleCanvas = document.createElement('canvas');
const sCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

class Particle {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.tx = this.x; this.ty = this.y;
        this.vx = 0; this.vy = 0;
        this.size = 1.5;
        this.color = '#fff';
    }
    update() {
        if (isExposed) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.96; this.vy *= 0.96; 
        } else {
            // High-performance easing
            this.vx = (this.tx - this.x) * 0.07;
            this.vy = (this.ty - this.y) * 0.07;
            this.x += this.vx;
            this.y += this.vy;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    
    // Scale main canvas for DPR
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);

    // Keep sample canvas at 1:1 for pixel mapping
    sampleCanvas.width = w;
    sampleCanvas.height = h;
    
    if(!isExposed) morph(count);
}

function morph(content) {
    sCtx.clearRect(0, 0, w, h);
    sCtx.fillStyle = "white";
    sCtx.textAlign = "center";
    sCtx.textBaseline = "middle";
    sCtx.font = `bold ${Math.min(w, h) * 0.7}px sans-serif`;
    sCtx.fillText(content, w/2, h/2);

    const imgData = sCtx.getImageData(0, 0, w, h).data;
    const points = [];
    const gap = 4; 

    for (let y = 0; y < h; y += gap) {
        for (let x = 0; x < w; x += gap) {
            const alpha = imgData[(y * w + x) * 4 + 3];
            if (alpha > 128) {
                points.push({x, y});
            }
        }
    }

    // Adjust particle count to match shape density
    if (particles.length < points.length) {
        for (let i = particles.length; i < points.length; i++) particles.push(new Particle());
    }

    particles.forEach((p, i) => {
        const pt = points[i % points.length];
        p.tx = pt.x; p.ty = pt.y;
        // Dynamic color shift based on count
        p.color = (count === "WIN") ? "#00f2fe" : `hsl(${180 + (parseInt(count) * 15)}, 80%, 60%)`;
    });
}

function expose() {
    isExposed = true;
    msg.innerText = "Sequence Complete // Exposure Active";
    particles.forEach(p => {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 20 + 10;
        p.vx = Math.cos(angle) * velocity;
        p.vy = Math.sin(angle) * velocity;
        p.color = "#fff";
    });

    setTimeout(() => {
        isExposed = false;
        count = "WIN";
        morph("WIN");
        msg.innerText = "System Exposed";
    }, 1500);
}

function loop() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
    ctx.fillRect(0, 0, w, h);
    
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(loop);
}

// Initialization
window.addEventListener('resize', resize);
document.getElementById('current-date').textContent = new Date().toLocaleDateString();
resize();

const timer = setInterval(() => {
    if (!isExposed && count !== "WIN") {
        count--;
        if (count > 0) {
            morph(count);
            msg.innerText = `Synchronizing: ${count}`;
        } else {
            clearInterval(timer);
            expose();
        }
    }
}, 1000);

loop();
</script>
</body>
</html>
