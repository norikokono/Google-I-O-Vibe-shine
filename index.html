<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Orange Corner Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; cursor: crosshair; }

        /* Multi-corner non-uniform orange gradients */
        #corner-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 0% 0%, rgba(255, 100, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 0%, rgba(255, 60, 0, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 100% 100%, rgba(255, 140, 0, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(255, 80, 0, 0.1) 0%, transparent 35%);
        }

        #gradient-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.05) 50%),
                        linear-gradient(90deg, rgba(255, 100, 0, 0.03), rgba(0, 255, 255, 0.03));
            background-size: 100% 4px, 4px 100%;
            opacity: 0.4;
        }

        canvas { display: block; position: relative; z-index: 3; background: transparent; filter: contrast(1.3) brightness(1.2); }
        
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-4px, -2px); }
            50% { transform: translate(3px, 1px); }
            75% { transform: translate(-2px, 3px); }
            100% { transform: translate(1px, -1px); }
        }
        .shaking { animation: shake 0.1s infinite; }

        #ui {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6); font-size: 10px; letter-spacing: 5px;
            pointer-events: none; text-transform: uppercase; z-index: 10; text-align: center;
            line-height: 1.8;
        }

        #footer-stamp {
            position: absolute; bottom: 20px; right: 20px;
            color: rgba(255, 255, 255, 0.3); font-size: 9px;
            letter-spacing: 2px; text-transform: uppercase; z-index: 10; text-align: right;
        }

        #creator-name { color: #ff6a00; font-weight: bold; }
    </style>
</head>
<body>
    <div id="corner-glow"></div>
    <div id="gradient-overlay"></div>
    <div id="scanlines"></div>
    
    <div id="ui">
        STATUS: <span id="msg">INITIALIZING...</span><br>
        <small style="letter-spacing: 1px; opacity: 0.5;">(CLICK SCREEN TO ENABLE AUDIO SYNC)</small>
    </div>

    <canvas id="c"></canvas>

    <div id="footer-stamp">
        AUDIT REF: <span id="creator-name">CVE-2026-3298</span><br>
        DATE: <span id="current-date"></span>
    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('gradient-overlay');
const msg = document.getElementById('msg');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, volume) {
    if (audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

let w, h, dpr, particles = [];
let count = 10;
let isExposed = false;

const sampleCanvas = document.createElement('canvas');
const sCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });

class Particle {
    constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.tx = this.x; this.ty = this.y;
        this.vx = 0; this.vy = 0;
        this.size = Math.random() * 2 + 1;
        this.color = '#fff';
    }
    update() {
        if (isExposed) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.95; this.vy *= 0.95; 
        } else {
            this.vx = (this.tx - this.x) * 0.15;
            this.vy = (this.ty - this.y) * 0.15;
            this.x += this.vx; this.y += this.vy;
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    sampleCanvas.width = w; sampleCanvas.height = h;
    if(!isExposed) morph(count);
}

function morph(content) {
    sCtx.clearRect(0, 0, w, h);
    sCtx.fillStyle = "white";
    sCtx.textAlign = "center";
    sCtx.textBaseline = "middle";
    sCtx.font = `bold ${Math.min(w, h) * 0.8}px sans-serif`;
    sCtx.fillText(content, w/2, h/2);

    const hue = 20 + (parseInt(count) * 5); // Shifted toward orange/red
    overlay.style.opacity = "0.5";
    overlay.style.background = `radial-gradient(circle, hsla(${hue}, 100%, 50%, 0.4) 0%, transparent 60%)`;
    setTimeout(() => { if(!isExposed) overlay.style.opacity = "0"; }, 200);

    const imgData = sCtx.getImageData(0, 0, w, h).data;
    const points = [];
    for (let y = 0; y < h; y += 4) {
        for (let x = 0; x < w; x += 4) {
            if (imgData[(y * w + x) * 4 + 3] > 128) points.push({x, y});
        }
    }

    if (particles.length < points.length) {
        for (let i = particles.length; i < points.length; i++) particles.push(new Particle());
    }

    particles.forEach((p, i) => {
        const pt = points[i % points.length];
        p.tx = pt.x; p.ty = pt.y;
        p.color = (count === "WIN") ? "#ff4400" : `hsl(${hue}, 100%, 70%)`;
    });
    
    if (content !== "WIN") {
        canvas.classList.add('shaking');
        setTimeout(() => canvas.classList.remove('shaking'), 150);
        playSound(150 + (10 - count) * 40, 'sine', 0.1, 0.1);
    }
}

function expose() {
    isExposed = true;
    msg.innerText = "CRITICAL :: MEMORY_CORRUPTION_DETECTED";
    
    overlay.style.opacity = "1";
    overlay.style.background = `radial-gradient(circle, rgba(255, 68, 0, 0.8) 0%, rgba(255, 0, 0, 0.4) 50%, transparent 100%)`;
    
    canvas.classList.add('shaking');
    playSound(50, 'sawtooth', 1.8, 0.4);

    particles.forEach(p => {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 50 + 20;
        p.vx = Math.cos(angle) * velocity;
        p.vy = Math.sin(angle) * velocity;
        p.color = Math.random() > 0.3 ? "#ffaa00" : "#fff"; 
    });

    setTimeout(() => {
        isExposed = false;
        count = "WIN";
        morph("WIN");
        canvas.classList.remove('shaking');
        msg.innerText = "ACE SUCCESSFUL :: SANDBOX_ESCAPED";
        overlay.style.opacity = "0.2";
    }, 1800);
}

function loop() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
}

window.addEventListener('mousedown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); });
window.addEventListener('resize', resize);
document.getElementById('current-date').textContent = new Date().toLocaleDateString();
resize();

const timer = setInterval(() => {
    if (!isExposed && count !== "WIN") {
        count--;
        if (count > 0) { 
            morph(count);
            msg.innerText = `BYPASSING MITIGATIONS: ${count}`; 
        } 
        else { 
            clearInterval(timer); 
            expose(); 
        }
    }
}, 1000);

loop();
</script>
</body>
</html>
