<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Countdown | Fixed Gradient</title>
    <style>
        /* 1. Body must be neutral to prevent layering bugs */
        body { 
            margin: 0; 
            background: #000; /* Fallback */
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            cursor: crosshair;
        }

        /* 2. The Background Layer handles the black AND the orange */
        #background-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            /* Added a subtle blur to smooth the gradient transition */
            filter: blur(2px); 
            background: 
                radial-gradient(circle at 0% 0%, rgba(255, 100, 0, 0.2) 0%, transparent 25%),
                radial-gradient(circle at 100% 0%, rgba(255, 60, 0, 0.12) 0%, transparent 20%),
                radial-gradient(circle at 100% 100%, rgba(255, 140, 0, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 0% 100%, rgba(255, 80, 0, 0.1) 0%, transparent 22%),
                #000; /* The black center is now part of this stack */
        }

        /* 3. The Texture Layer must sit ABOVE the orange but BELOW the particles */
        #texture-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1; 
            opacity: 0.15;
            background-repeat: repeat;
        }

        .grid { background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px); background-size: 30px 30px; }
        .lines { background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.05) 3px); }
        .noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

        /* 4. Canvas sits on top of everything else */
        canvas { 
            display: block; 
            position: relative; 
            z-index: 2; 
            background: transparent; /* Crucial: must be transparent */
            filter: contrast(1.2) brightness(1.2); 
        }

        /* UI and Stamp */
        #ui { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, 0.4); font-size: 10px; letter-spacing: 5px; z-index: 10; text-align: center; }
        #footer-stamp { position: absolute; bottom: 20px; right: 20px; color: rgba(255, 255, 255, 0.2); font-size: 9px; letter-spacing: 2px; z-index: 10; text-align: right; }
        #creator-name { color: #00f2fe; font-weight: bold; }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-2px, -1px); }
            50% { transform: translate(-1px, 2px); }
            100% { transform: translate(1px, -1px); }
        }
        .shaking { animation: shake 0.15s infinite; }
    </style>
</head>
<body>
    <!-- LAYER 0: Background + Orange -->
    <div id="background-layer"></div> 
    
    <!-- LAYER 1: Texture -->
    <div id="texture-overlay" class="grid"></div>
    
    <!-- LAYER 2: UI -->
    <div id="ui">STATUS: <span id="msg">INITIALIZING...</span></div>
    
    <!-- LAYER 3: Particles -->
    <canvas id="c"></canvas>

    <div id="footer-stamp">
        COLLABORATION: <span id="creator-name">GEMINI AI & NORIKO</span><br>
        DATE: <span id="current-date"></span>
    </div>

    <!-- [Your existing <script> goes here] -->
</body>
</html>
